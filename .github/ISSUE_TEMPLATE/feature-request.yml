name: Feature Request
description: For requesting new features
title: "[FR]: "
type: feature
body:
  - type: textarea
    id: feature_description
    attributes:
      label: Feature
      description: Describe the outcome you want to achieve. For a new delegated capability, explain the bounded targets and data policy it would need.
    validations:
      required: true
  - type: textarea
    id: linked_discussion
    attributes:
      label: Linked discussion
      description: Link the discussion with 10 or more upvotes. Without a valid linked discussion, this request may be migrated to a discussion for upvoting.
      placeholder: |
        #1234
    validations:
      required: true
